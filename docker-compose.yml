# Development databases only. Production uses a non-expiring Postgres such as
# Neon for the control plane (see README Deployment) and the org's own
# provider for each tenant.
services:
  controlplane:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fundvault
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: fundvault_control
    ports:
      - "5433:5432"
    volumes:
      - controlplane_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundvault -d fundvault_control"]
      interval: 1s
      retries: 30

  tenant_dev:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fundvault
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: fundvault_tenant_dev
    ports:
      - "5434:5432"
    volumes:
      - tenant_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundvault -d fundvault_tenant_dev"]
      interval: 1s
      retries: 30

volumes:
  controlplane_data:
  tenant_dev_data:
